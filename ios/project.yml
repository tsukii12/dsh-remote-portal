name: DSHRemote
options:
  bundleIdPrefix: io.github.tsukii12
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  DSHRemote:
    type: application
    platform: iOS
    sources:
      - path: DSHRemote
        excludes: [en.lproj, zh-Hans.lproj]
      - path: DSHRemote/en.lproj
        buildPhase: resources
      - path: DSHRemote/zh-Hans.lproj
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.tsukii12.dshremote
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: DSHRemote/Info.plist
      properties:
        CFBundleDisplayName: DRP
        CFBundleName: DRP
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Connect to your DeepSeek Harness on the local network.
  DSHRemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources: [DSHRemoteTests]
    dependencies:
      - target: DSHRemote
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  DSHRemote:
    build:
      targets:
        DSHRemote: all
    test:
      targets: [DSHRemoteTests]
