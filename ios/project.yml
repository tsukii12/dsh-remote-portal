name: DSHRemote
options:
  bundleIdPrefix: io.github.tsukii12
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  DSHRemote:
    type: application
    platform: iOS
    sources: [DSHRemote]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.tsukii12.dshremote
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: DSHRemote/Info.plist
      properties:
        CFBundleDisplayName: dsh Remote
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSCameraUsageDescription: Take a photo to upload to your workspace.
        NSMicrophoneUsageDescription: Record media for your workspace.
        NSLocalNetworkUsageDescription: Connect to your DeepSeek Harness on the local network.
  DSHRemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources: [DSHRemoteTests]
    dependencies:
      - target: DSHRemote
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  DSHRemote:
    build:
      targets:
        DSHRemote: all
    test:
      targets: [DSHRemoteTests]
