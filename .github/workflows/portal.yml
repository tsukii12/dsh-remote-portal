name: Portal gateway
on:
  pull_request:
    paths: ['*.js', '*.json', 'lib/**', 'assets/**', 'tools/**', 'test/**', '.github/workflows/portal.yml']
  push:
    branches: [master, devin/1795101871-ios-app]
    paths: ['*.js', '*.json', 'lib/**', 'assets/**', 'tools/**', 'test/**', '.github/workflows/portal.yml']
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
